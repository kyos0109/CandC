name: Verify and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching package.json (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish after all three platforms pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    outputs:
      commit: ${{ steps.release_identity.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate existing tag and package version
        id: release_identity
        env:
          CANDC_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "const fs=require('node:fs'),cp=require('node:child_process'); const tag=process.env.CANDC_RELEASE_TAG; if(!/^v\d+\.\d+\.\d+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$/.test(tag)||tag!=='v'+JSON.parse(fs.readFileSync('package.json')).version) process.exit(1); cp.execFileSync('git',['show-ref','--verify','refs/tags/'+tag]); fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()+'\n');"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:coverage -- --maxWorkers 1
      - run: npm run build:isolated
      - run: npm run test:e2e
      - run: npm run test:install
      - run: npm audit
      - run: npm run secrets:scan
        if: runner.os == 'Windows'
      - run: npm run export:public
        if: runner.os == 'Windows'
      - name: Package verified runtime and repository-specific installer
        if: runner.os == 'Windows'
        env:
          CANDC_RELEASE_REPO: ${{ github.repository }}
        run: node scripts/package-release.mjs --build .cache/verification --repo $env:CANDC_RELEASE_REPO --output .cache/release-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: release-candidate
          path: .cache/release-candidate/*
          if-no-files-found: error
          retention-days: 7
  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require successful main-branch verification for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDC_RELEASE_SHA: ${{ needs.verify.outputs.commit }}
        run: |
          [[ "$CANDC_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          passed=false
          for attempt in $(seq 1 30); do
            result=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$CANDC_RELEASE_SHA&event=push&branch=main&per_page=100" --jq '.workflow_runs | sort_by(.id) | last | [.status // "missing", .conclusion // "pending"] | join(":")')
            case "$result" in
              completed:success) passed=true; break ;;
              completed:*|missing:*) echo "Main-branch verification did not pass: $result"; exit 1 ;;
              *) echo "Waiting for main-branch verification: $result"; sleep 10 ;;
            esac
          done
          test "$passed" = true
      - name: Download candidate and create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDC_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          CANDC_RUN_ID: ${{ github.run_id }}
          CANDC_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          gh run download "$CANDC_RUN_ID" --name release-candidate --dir candidate
          cd candidate
          sha256sum --check SHA256SUMS
          flags=(--draft)
          if [[ "$CANDC_PUBLISH" == "true" ]]; then
            flags=(--latest)
          fi
          if [[ "$CANDC_RELEASE_TAG" == *-* ]]; then
            flags=(--prerelease)
            if [[ "$CANDC_PUBLISH" != "true" ]]; then flags+=(--draft); fi
          fi
          gh release create "$CANDC_RELEASE_TAG" ./* --verify-tag "${flags[@]}" --title "CandC $CANDC_RELEASE_TAG" --notes "Cross-platform runtime, installation scripts and SHA-256 checksums. Verified on Windows, macOS and Ubuntu. Requires Node.js 24."
