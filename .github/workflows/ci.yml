name: Cross-platform verification

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:coverage -- --maxWorkers 1
      - run: npm run build:isolated
      - run: npm run test:e2e
      - run: npm run test:install
      - run: npm audit
      - run: npm run secrets:scan
        if: runner.os == 'Windows'
      - run: npm run export:public
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: verification-failure-${{ matrix.os }}
          path: |
            .cache/playwright-results
            .cache/coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore
